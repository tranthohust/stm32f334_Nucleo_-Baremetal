<svg xmlns="http://www.w3.org/2000/svg" width="940" height="910" viewBox="0 0 940 910" role="img" aria-labelledby="spi-title">
<title id="spi-title">SPI: nhận yêu cầu trước, báo kết quả sau</title>
<rect width="100%" height="100%" fill="white"/>
<text x="470.0" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#172b43">SPI: nhận yêu cầu trước, báo kết quả sau</text>
<rect x="170" y="80" width="600" height="96" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470.0" y="104" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1. APPLICATION SUBMIT</text>
<text x="470.0" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">SPI_Submit copy descriptor vào queue</text>
<text x="470.0" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">TX/RX buffer phải sống tới callback</text>
<rect x="170" y="212" width="600" height="96" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="470.0" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f766e">2. PROCESS BẮT ĐẦU</text>
<text x="470.0" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Lấy transaction, đặt mode và tốc độ</text>
<text x="470.0" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Enable SPI, kéo CS xuống thấp</text>
<polyline points="470,176 470,212" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="470,212 466.0853101929989,203.8959760788259 473.9146898070011,203.8959760788259" fill="#64748b"/>
<rect x="170" y="344" width="600" height="96" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="470.0" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#b45309">3. NGOẠI VI TRAO ĐỔI BIT</text>
<text x="470.0" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">SCK tạo nhịp, MOSI gửi, MISO nhận</text>
<text x="470.0" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Một byte TX đi cùng một byte RX</text>
<polyline points="470,308 470,344" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="470,344 466.0853101929989,335.8959760788259 473.9146898070011,335.8959760788259" fill="#64748b"/>
<rect x="170" y="476" width="600" height="96" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="470.0" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f766e">4. IRQ CẬP NHẬT TIẾN ĐỘ</text>
<text x="470.0" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">TXE ghi DR; RXNE đọc DR</text>
<text x="470.0" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Lặp từng byte đến đủ length</text>
<polyline points="470,440 470,476" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="470,476 466.0853101929989,467.8959760788259 473.9146898070011,467.8959760788259" fill="#64748b"/>
<rect x="170" y="608" width="600" height="96" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="470.0" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f766e">5. PROCESS ĐỢI HẾT BẬN</text>
<text x="470.0" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Đủ RX, TX FIFO rỗng, BSY = 0</text>
<text x="470.0" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Nhả CS; timeout thì báo lỗi</text>
<polyline points="470,572 470,608" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="470,608 466.0853101929989,599.8959760788259 473.9146898070011,599.8959760788259" fill="#64748b"/>
<rect x="170" y="740" width="600" height="96" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470.0" y="764" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">6. CALLBACK VỀ APPLICATION</text>
<text x="470.0" y="792" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">spi_complete xem dữ liệu hoặc lỗi</text>
<text x="470.0" y="815" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Chạy trong main / Comm task, ngoài ISR</text>
<polyline points="470,704 470,740" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="470,740 466.0853101929989,731.8959760788259 473.9146898070011,731.8959760788259" fill="#64748b"/>
</svg>