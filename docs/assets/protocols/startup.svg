<svg xmlns="http://www.w3.org/2000/svg" width="940" height="690" viewBox="0 0 940 690" role="img" aria-labelledby="startup-title">
<title id="startup-title">Cùng phần cứng, hai cách tổ chức chương trình</title>
<rect width="100%" height="100%" fill="white"/>
<text x="470.0" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Cùng phần cứng, hai cách tổ chức chương trình</text>
<rect x="260" y="70" width="420" height="96" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="470.0" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#b45309">RESET → MAIN</text>
<text x="470.0" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Khởi tạo RAM và timebase 1 ms</text>
<polyline points="470,166 470,204 232,204 232,240" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="232,240 228.08531019299892,231.8959760788259 235.91468980700108,231.8959760788259" fill="#64748b"/>
<polyline points="470,204 710,204 710,240" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="710,240 706.0853101929989,231.8959760788259 713.9146898070011,231.8959760788259" fill="#64748b"/>
<rect x="32" y="240" width="400" height="96" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="232.0" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">BARE-METAL</text>
<text x="232.0" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">CommunicationDemo_Init</text>
<text x="232.0" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Một vòng lặp main gọi các Process</text>
<rect x="510" y="240" width="400" height="96" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="710.0" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">FREERTOS</text>
<text x="710.0" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Tạo task, queue và mutex tĩnh</text>
<text x="710.0" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">vTaskStartScheduler</text>
<polyline points="232,336 232,390" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="232,390 228.08531019299892,381.8959760788259 235.91468980700108,381.8959760788259" fill="#64748b"/>
<rect x="32" y="390" width="400" height="96" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="232.0" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f766e">MAIN SỞ HỮU CÁC DRIVER</text>
<text x="232.0" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Luân phiên UART / SPI / I2C / CAN</text>
<text x="232.0" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Callback chạy trong main</text>
<polyline points="710,336 710,390" fill="none" stroke="#64748b" stroke-width="1.5" />
<polygon points="710,390 706.0853101929989,381.8959760788259 713.9146898070011,381.8959760788259" fill="#64748b"/>
<rect x="510" y="390" width="400" height="96" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="710.0" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f766e">TASK CÓ QUYỀN SỞ HỮU</text>
<text x="710.0" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Comm: UART / SPI / CAN</text>
<text x="710.0" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">I2CWorker: I2C; Producer: gửi request</text>
<text x="470" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Driver và thanh ghi không đổi theo cách lập lịch.</text>
<text x="470" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b43">Bare-metal nhường bằng cách return. Task nhường bằng delay hoặc chờ sự kiện.</text>
</svg>